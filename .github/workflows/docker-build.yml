name: Build and Publish Docker Images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image locally (validation)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local/firemail2:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure Docker Hub credentials
        if: github.event_name == 'push'
        run: |
          if [[ -z "${DOCKER_HUB_USERNAME:-}" || -z "${DOCKER_HUB_TOKEN:-}" ]]; then
            echo "::error::Docker Hub credentials are required. Set DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN secrets."
            exit 1
          fi

      - name: Prepare tags
        if: github.event_name == 'push'
        id: prep
        run: |
          set -euo pipefail

          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker_repo="${DOCKER_HUB_USERNAME}/$(basename "${repo_lower}")"
          ghcr_repo="ghcr.io/${repo_lower}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          ghcr_enabled=false
          if [[ -n "${GH_TOKEN:-}" ]]; then
            if response_headers=$(curl -sSL -o /dev/null -D - \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user); then
              scopes=$(printf '%s' "${response_headers}" | awk -F': ' '/^x-oauth-scopes:/ {print $2}' | tr -d '\r')

              if [[ "${scopes}" == *"write:packages"* ]]; then
                ghcr_enabled=true
              else
                echo "::warning::GH_TOKEN is missing write:packages scope; GHCR images will be skipped."
              fi
            else
              echo "::warning::Failed to inspect GH_TOKEN scopes; skipping GHCR publishing."
            fi
          else
            echo "::warning::GH_TOKEN secret not configured; GHCR images will be skipped."
          fi

          mapfile -t docker_tags < <(printf '%s\n' "${docker_repo}:sha-${short_sha}")
          mapfile -t ghcr_tags < <(printf '%s\n' "${ghcr_repo}:sha-${short_sha}")

          if [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            docker_tags+=("${docker_repo}:latest")
            ghcr_tags+=("${ghcr_repo}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            docker_tags+=("${docker_repo}:${version}")
            ghcr_tags+=("${ghcr_repo}:${version}")
            docker_tags+=("${docker_repo}:latest")
            ghcr_tags+=("${ghcr_repo}:latest")
          fi

          {
            printf 'docker-tags<<EOF\n'
            printf '%s\n' "${docker_tags[@]}"
            printf 'EOF\n'

            printf 'ghcr-tags<<EOF\n'
            if [[ "${ghcr_enabled}" == true ]]; then
              printf '%s\n' "${ghcr_tags[@]}"
            fi
            printf 'EOF\n'

            printf 'ghcr-enabled=%s\n' "${ghcr_enabled}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && steps.prep.outputs.ghcr-enabled == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: Build and push multi-arch images
        if: github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.prep.outputs.docker-tags }}
            ${{ steps.prep.outputs.ghcr-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
