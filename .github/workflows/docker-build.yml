name: Build and Publish Docker Images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  build:
    name: Build (validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image locally
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: local/firemail2:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and push release images
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare tags
        id: prep
        run: |
          set -euo pipefail

          if [[ -z "${DOCKER_HUB_USERNAME:-}" || -z "${DOCKER_HUB_TOKEN:-}" ]]; then
            echo "::error::Docker Hub credentials are required. Set DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN secrets."
            exit 1
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GH_TOKEN with write:packages scope is required to publish to GHCR."
            exit 1
          fi

          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker_repo="${DOCKER_HUB_USERNAME}/$(basename "${repo_lower}")"
          ghcr_repo="ghcr.io/${repo_lower}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          mapfile -t tags < <(printf '%s\n' \
            "${docker_repo}:sha-${short_sha}" \
            "${ghcr_repo}:sha-${short_sha}")

          if [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            tags+=("${docker_repo}:latest")
            tags+=("${ghcr_repo}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            tags+=("${docker_repo}:${version}")
            tags+=("${ghcr_repo}:${version}")
            tags+=("${docker_repo}:latest")
            tags+=("${ghcr_repo}:latest")
          fi

          {
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags[@]}"
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
