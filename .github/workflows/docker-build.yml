name: Build and Publish Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare image tags
        id: prep
        run: |
          set -euo pipefail
          default_branch="${DEFAULT_BRANCH:-main}"
          push_images="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            push_images="true"
          fi

          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ -n "${DOCKER_HUB_USERNAME:-}" && -n "${DOCKER_HUB_TOKEN:-}" ]]; then
            repo_name="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
            image="${DOCKER_HUB_USERNAME}/${repo_name}"
            docker_tags=("${image}:sha-${short_sha}")
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              if [[ "${GITHUB_REF}" == "refs/heads/${default_branch}" ]]; then
                docker_tags+=("${image}:latest")
              elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                version="${GITHUB_REF#refs/tags/}"
                docker_tags+=("${image}:${version}")
                docker_tags+=("${image}:latest")
              fi
            fi
            {
              printf 'docker_tags<<EOF\n'
              printf '%s\n' "${docker_tags[@]}"
              printf 'EOF\n'
            } >> "${GITHUB_OUTPUT}"
          else
            echo "docker_tags=" >> "${GITHUB_OUTPUT}"
          fi

          image="ghcr.io/${GITHUB_REPOSITORY}"
          ghcr_tags=("${image}:sha-${short_sha}")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF}" == "refs/heads/${default_branch}" ]]; then
              ghcr_tags+=("${image}:latest")
            elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              version="${GITHUB_REF#refs/tags/}"
              ghcr_tags+=("${image}:${version}")
              ghcr_tags+=("${image}:latest")
            fi
          fi
          {
            printf 'ghcr_tags<<EOF\n'
            printf '%s\n' "${ghcr_tags[@]}"
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

          echo "push=${push_images}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        if: ${{ steps.prep.outputs.docker_tags != '' && steps.prep.outputs.push == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ env.GH_TOKEN != '' && steps.prep.outputs.push == 'true' }}
        id: login_ghcr
        continue-on-error: true
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: Warn when GHCR authentication fails
        if: ${{ env.GH_TOKEN != '' && steps.prep.outputs.push == 'true' && steps.login_ghcr.outcome != 'success' }}
        run: |
          echo '::warning::Failed to authenticate to ghcr.io with GH_TOKEN. Skipping GHCR pushes. Ensure the token includes the write:packages scope.'

      - name: Build Docker Hub image
        if: ${{ steps.prep.outputs.docker_tags != '' }}
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ steps.prep.outputs.push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prep.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build GHCR image
        if: ${{ steps.prep.outputs.ghcr_tags != '' }}
        id: build_ghcr
        continue-on-error: true
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ steps.prep.outputs.push == 'true' && steps.login_ghcr.outcome == 'success' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prep.outputs.ghcr_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Warn when GHCR push fails
        if: ${{ steps.prep.outputs.push == 'true' && steps.prep.outputs.ghcr_tags != '' && steps.build_ghcr.outcome == 'failure' }}
        run: |
          echo '::warning::Failed to push image to ghcr.io. Verify GH_TOKEN has the write:packages scope or remove the secret to skip GHCR publishing.'
